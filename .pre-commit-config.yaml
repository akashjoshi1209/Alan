# Pre-commit configuration for Alan
# Install with: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Black - Code formatter (backup, mainly for compatibility)
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        types_or: [python, pyi]
        language_version: python3.11

  # MyPy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [
          "pydantic>=2.7.0",
          "sqlalchemy>=2.0.30",
          "fastapi>=0.111.0",
          "typer>=0.12.0",
          "rich>=13.7.0",
        ]
        args: [--strict, --show-error-codes, --pretty]
        types_or: [python, pyi]

  # Bandit - Security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-r, alan, -ll, -f, json, -o, bandit-report.json]
        types_or: [python, pyi]

  # Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package-lock.json

  # Check for merge conflicts
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: debug-logger
      - id: end-of-file-fixer
        types_or: [python, pyi, toml, yaml, yml, json, md, txt, sh]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        types_or: [python, pyi, toml, yaml, yml, json, md, txt, sh]

  # Check Python syntax
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-ast
        types_or: [python, pyi]

  # Sort requirements.txt
  - repo: https://github.com/asottile/reorder-python-imports
    rev: v3.13.0
    hooks:
      - id: reorder-python-imports
        args: [--py311-plus]

  # Validate pyproject.toml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-toml

  # Validate markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        types_or: [markdown]