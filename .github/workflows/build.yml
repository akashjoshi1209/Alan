name: Build Alan APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup Git LFS
        run: |
          sudo apt-get update && sudo apt-get install -y git-lfs
          git lfs install
      
      - name: Pull LFS files
        run: git lfs pull
      
      - name: Verify gradlew
        run: |
          ls -la gradlew
          ls -la gradle/wrapper/gradle-wrapper.jar
          head -5 gradlew
      
      - name: Create local.properties
        run: echo "sdk.dir=${{ env.ANDROID_SDK_ROOT }}" > local.properties
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '35.0.0'
          ndk-version: 'r27c'
          cmdline-tools-version: 'latest'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      
      - name: Build Release APK (if signing secrets available)
        if: ${{ secrets.SIGNING_KEY_ALIAS != '' }}
        run: ./gradlew assembleRelease --no-daemon
        env:
          ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && secrets.SIGNING_KEY_ALIAS != ''
        with:
          name: alan-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
      
      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && secrets.SIGNING_KEY_ALIAS != ''
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Pull LFS files
        run: git lfs pull
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
      
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
