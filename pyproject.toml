# Byte-order mark for UTF-8
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alan"
version = "0.1.0"
description = "Personal AI Operating System - Modular, privacy-first AI companion"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Alan Team", email = "team@alan.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
keywords = ["ai", "assistant", "agents", "mcp", "voice", "local-first"]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pydantic-extra-types>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "anyio>=4.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pg8000>=1.30.0",
    "redis>=5.0.0",
    "chromadb>=0.5.0",
    "structlog>=24.1.0",
    "loguru>=0.7.2",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "orjson>=3.10.0",
    "python-dateutil>=2.9.0",
    "python-slugify>=8.0.0",
    "tenacity>=8.2.0",
    "cachetools>=5.3.0",
    "xxhash>=3.4.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=24.3.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pyright>=1.1.380",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.13.0",
    "pytest-xdist>=3.5.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
]
psycopg = [
    "psycopg2-binary>=2.9.9",
]
ai = [
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.7.0",
    "ollama>=0.3.0",
]
voice = [
    "faster-whisper>=1.1.0",
    "pyttsx3>=2.90",
    "pvporcupine>=3.0.0",
    "webrtcvad>=2.0.10",
    "pyaudio>=0.2.13",
]
mcp = [
    "mcp>=0.1.0",
]
all = [
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.7.0",
    "ollama>=0.3.0",
    "faster-whisper>=1.1.0",
    "pyttsx3>=2.90",
    "pvporcupine>=3.0.0",
    "webrtcvad>=2.0.10",
    "pyaudio>=0.2.13",
    "mcp>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/alan-ai/alan"
Repository = "https://github.com/alan-ai/alan"
Issues = "https://github.com/alan-ai/alan/issues"
Documentation = "https://alan.ai/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["alan*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["alan/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--asyncio-mode=auto",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "ai: Tests requiring AI provider API keys",
    "voice: Tests requiring voice hardware",
    "db: Tests requiring database",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-style = "space"
indent-width = 4
quote-style = "double"
skip-magic-trailing-comma = true
respect-pep8-naming = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "T201",  # print statement
    "ARG001", # unused argument
    "ARG002", # unused method argument
]
per-file-ignores = [
    "tests/* = [\"S101\", \"SLF001\", \"T201\"]",
    "scripts/* = [\"T201\", \"S101\"]",
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
indent-width = 4
line-width = 100
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\\.pyi?$'
extend-exclude = '''
/(
  \\.git
  | \\.venv
  | venv
  | build
  | dist
  | \\.mypy_cache
  | \\.ruff_cache
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
enable_error_code = [
    "arg-type",
    "attr-defined",
    "dict-type",
    "index",
    "misc",
    "name-defined",
    "no-untyped-call",
    "no-untyped-def",
    "override",
    "return-value",
    "union-attr",
    "valid-type",
]
exclude = [
    "build",
    "dist",
    ".venv",
    "venv",
    ".mypy_cache",
    ".ruff_cache",
    "__pycache__",
    "tests",
    "scripts",
]

[tool.coverage.run]
source = ["alan"]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/migrations/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2

[tool.pre-commit-hooks]
# Configured in .pre-commit-config.yaml

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
pythonPlatform = "Linux"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportMissingTypeStubs = "warning"
include = ["alan"]
exclude = [
    "**/tests/**",
    "**/scripts/**",
    "**/migrations/**",
]