[pytest]
# Without this, `python -m pytest -q` at the repo root walks *everything*,
# including env\python and env\browser\python -- two bundled interpreters, each
# with its own site-packages full of test_*.py files that pytest then tries to
# import. Measured: 73 s of collection, zero of Alan's own tests collected, and
# a crash on win32comext\taskscheduler\test\test_addtask.py.
#
# This is not hypothetical: Alan's own coding provider infers exactly this
# command when asked to test this repository, so the flaw was reachable through
# `code.test` and `alan ask` as well as by hand.
testpaths = tests

norecursedirs = env data logs .git __pycache__ *.egg-info scripts docs demos .pytest_cache
